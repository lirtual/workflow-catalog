name: Catalog business checks
on:
  pull_request:
    paths:
      - workflows/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/catalog-checks.yml
  push:
    branches: [main]
    paths:
      - workflows/**
      - scripts/**
      - tests/**
      - package.json
      - .github/workflows/catalog-checks.yml

permissions:
  contents: read

jobs:
  raindrop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install verification-only dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline business contract tests
        run: npm test
